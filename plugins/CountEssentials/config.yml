# CountEssentials
starting-balance: 0
autosave-seconds: 120

# Tampilkan saldo di bawah gamertag. Vanilla merender "<angka> <suffix>", contoh: 80 $
money-below-name: true
money-below-name-suffix: "$"

tpa-expire-seconds: 120

rtp:
  radius: 5000
  min-radius: 200
  max-attempts: 40
  # Overworld hanya mendarat di blok ini (nether = lantai solid aman, end = END_STONE)
  overworld-ground:
    - GRASS_BLOCK

